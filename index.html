<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>รีวิวจากผู้ที่เคยเปิดไพ่ | DataBest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500&family=Noto+Serif+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--serif:'Noto Serif Thai','Times New Roman',serif;--sans:'IBM Plex Sans Thai','Helvetica Neue',sans-serif;--ease:cubic-bezier(.22,.7,.2,1)}
body[data-theme="night"]{--bg:#0B1030;--ink:#F3EAD3;--mute:#AEB4D6;--gold:#D9B56C;--panel:rgba(12,18,52,.93);--line:rgba(217,181,108,.42)}
body[data-theme="gold"]{--bg:#F6DE9A;--ink:#3A2410;--mute:#7A5B3A;--gold:#B8741B;--panel:rgba(255,250,236,.9);--line:rgba(184,116,27,.4)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .6s,color .6s}
button,a{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@keyframes spin{to{rotate:360deg}}
@keyframes twk{50%{opacity:.25}}

/* ---------- backdrops ---------- */
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;opacity:0;transition:opacity .5s}
body[data-theme="night"] .bg-night,body[data-theme="gold"] .bg-gold{opacity:1}
.bg-night,.rv-night{background:radial-gradient(75vmax 75vmax at 50% 42%,#26327A 0%,#121A4A 45%,#080C26 100%)}
.mandala{position:absolute;left:50%;top:50%;width:min(150vmin,1000px);aspect-ratio:1;translate:-50% -50%;opacity:.42;animation:spin 200s linear infinite}
.stars{position:absolute;inset:0}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#F3EAD3;animation:twk 4s ease-in-out infinite}
.bg-gold,.rv-gold{background:radial-gradient(circle at 50% 30%,#FFF6D5 0%,#F9D774 38%,#EDA83A 72%,#CF7E1C 100%)}
.sunburst{position:absolute;left:50%;top:30%;width:230vmax;height:230vmax;translate:-50% -50%;background:repeating-conic-gradient(rgba(255,255,255,.3) 0 5deg,transparent 5deg 15deg);animation:spin 140s linear infinite}

/* ---------- drifting reviews ---------- */
.drift{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:2;transition:opacity .5s}
.note{position:absolute;bottom:-200px;left:var(--x);width:230px;padding:13px 16px 14px;border-radius:5px 16px 16px 16px;background:rgba(255,255,255,.07);border:1px solid rgba(217,181,108,.35);color:#F3EAD3;opacity:var(--op);filter:blur(var(--bl));animation:rise var(--d) linear var(--dl) both;will-change:transform;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.note b{font-size:13px;font-weight:500;color:#EBCB86}
.note .st{margin-left:8px;font-size:11px;letter-spacing:1px;color:#F2C14E}
.note p{margin-top:5px;font-size:12.5px;line-height:1.55;color:#DCD8EA;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@keyframes rise{0%{transform:translate3d(0,0,0) scale(var(--s))}50%{transform:translate3d(var(--sw),-70vh,0) scale(var(--s))}100%{transform:translate3d(0,-140vh,0) scale(var(--s))}}

/* ---------- views ---------- */
.view{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;display:none;z-index:10;scrollbar-width:thin}
.view.on{display:block;animation:enter .9s var(--ease) both}
@keyframes enter{from{opacity:0;transform:scale(.97)}}
#v1{display:none;place-items:center;padding:20px 16px}
#v1.on{display:grid}
.hero{position:relative;width:min(430px,100%);padding:30px 26px 24px;text-align:center;background:var(--panel);border:1px solid var(--line);border-radius:26px;box-shadow:0 30px 70px -20px #000a,0 0 0 1px rgba(255,255,255,.03) inset;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.hero::before{content:"";position:absolute;inset:7px;border:1px solid rgba(217,181,108,.28);border-radius:20px;pointer-events:none}
.brand{font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.06em;color:var(--gold)}
h1,h2{font-family:var(--serif);font-weight:700;line-height:1.35}
h1{font-size:25px;margin:8px 0 6px}
.sub{font-size:13.5px;font-weight:300;color:var(--mute);line-height:1.7}
.qrwrap{position:relative;width:186px;height:186px;margin:20px auto 14px;padding:12px;background:#fff;border-radius:14px;box-shadow:0 0 0 1px rgba(217,181,108,.6),0 0 38px rgba(217,181,108,.35)}
.qrwrap img{width:100%;height:100%;display:block}
.qrwrap i{position:absolute;width:20px;height:20px;border:2px solid var(--gold)}
.qrwrap i:nth-of-type(1){left:-7px;top:-7px;border-right:0;border-bottom:0;border-radius:6px 0 0 0}
.qrwrap i:nth-of-type(2){right:-7px;top:-7px;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.qrwrap i:nth-of-type(3){left:-7px;bottom:-7px;border-right:0;border-top:0;border-radius:0 0 0 6px}
.qrwrap i:nth-of-type(4){right:-7px;bottom:-7px;border-left:0;border-top:0;border-radius:0 0 6px 0}
.lineid{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:var(--mute)}
.lineid b{font-family:var(--serif);font-size:20px;color:var(--ink);letter-spacing:.02em;user-select:all}
.mini{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--gold)}
.btns{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;border:0;border-radius:999px;padding:14px 16px;font-size:15.5px;font-weight:500;cursor:pointer;transition:transform .3s var(--ease),filter .3s,box-shadow .3s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn:active{transform:scale(.98)}
.btn.gold{flex:1.5;color:#2A1A05;background:linear-gradient(135deg,#F7DE9B,#DDA843);box-shadow:0 8px 24px -8px rgba(221,168,67,.7)}
.btn.ghost{background:transparent;border:1px solid var(--gold);color:var(--ink)}
.stat{margin-top:14px;min-height:18px;font-size:12px;color:var(--mute)}

/* ---------- reviews page ---------- */
.top{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:linear-gradient(#FFF1C8ee,#FFF1C800)}
.top .btn{flex:none;padding:10px 20px;font-size:14px}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.55);border-radius:999px;padding:9px 16px;font-size:14px;cursor:pointer;color:#3A2410}
.back svg{width:14px;height:14px}
.rhead{text-align:center;padding:10px 20px 22px}
.rhead .brand{color:#8F5410}
.rhead h2{font-size:26px;margin:6px 0 10px}
.avg{display:inline-flex;align-items:baseline;gap:8px;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.55);border:1px solid var(--line)}
.avg b{font-family:var(--serif);font-size:24px}
.avg .st{color:#E58A12;letter-spacing:2px}
.avg small{color:var(--mute);font-size:12.5px}
.wall{columns:2 290px;column-gap:14px;max-width:980px;margin:0 auto;padding:0 16px 60px}
.rc{break-inside:avoid;margin:0 0 14px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 30px -18px rgba(120,70,10,.5);animation:pop .7s var(--ease) both}
.rc .hd{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rc b{font-weight:500;font-size:14.5px;color:#5A3510}
.rc .st{color:#E58A12;letter-spacing:1.5px;font-size:12.5px}
.rc p{margin-top:8px;font-size:14px;line-height:1.8;font-weight:300;color:#3A2410;overflow-wrap:anywhere}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}}
.empty{text-align:center;padding:40px 20px;color:var(--mute);font-size:14px;column-span:all}

/* ---------- spiral of cards -> LINE ---------- */
.spiral{position:fixed;inset:0;z-index:90;display:none;background:radial-gradient(70vmax 70vmax at 50% 50%,#1F2A6B 0%,#0C1236 55%,#05081C 100%);overflow:hidden}
.spiral.on{display:block;animation:fadeIn .4s both}
@keyframes fadeIn{from{opacity:0}}
.sc{position:absolute;left:50%;top:50%;width:96px;height:150px;margin:-75px 0 0 -48px;opacity:0;transition:opacity .35s;will-change:transform}
.sc.on{opacity:1}
.sc svg{width:100%;height:100%;filter:drop-shadow(0 6px 12px rgba(0,0,0,.55))}
.sglow{position:absolute;left:50%;top:50%;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;background:radial-gradient(circle,#F7DE9Bcc,transparent 70%);animation:pls 1.6s ease-in-out infinite}
@keyframes pls{50%{transform:scale(1.5);opacity:.6}}
.cap{position:absolute;left:0;right:0;bottom:16vh;text-align:center;color:#EBCB86;font-family:var(--serif);font-size:16px;letter-spacing:.04em}
.fallback{position:absolute;left:50%;bottom:7vh;translate:-50% 0;padding:11px 24px;border-radius:999px;background:linear-gradient(135deg,#F7DE9B,#DDA843);color:#2A1A05;text-decoration:none;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:opacity .5s}
.fallback.on{opacity:1;pointer-events:auto}
.whiteout{position:absolute;inset:0;background:radial-gradient(circle,#fff,#FFE9A8);opacity:0;pointer-events:none}

/* ---------- spell transition ---------- */
.spell{position:fixed;inset:0;z-index:95;display:none;overflow:hidden;pointer-events:all;transition:opacity .6s}
.spell.on{display:block}
.spell.out{opacity:0}
.rv{position:absolute;inset:0;clip-path:circle(0% at 50% 50%)}
.rv-gold::after{content:"";position:absolute;left:50%;top:30%;width:230vmax;height:230vmax;translate:-50% -50%;background:repeating-conic-gradient(rgba(255,255,255,.3) 0 5deg,transparent 5deg 15deg)}
.sigil{position:absolute;left:50%;top:50%;width:min(80vmin,560px);aspect-ratio:1;margin:calc(min(80vmin,560px)/-2) 0 0 calc(min(80vmin,560px)/-2);opacity:0;filter:drop-shadow(0 0 14px #F7DE9B)}
.sigil.cast{animation:cast 1.5s cubic-bezier(.3,.6,.3,1) both}
@keyframes cast{0%{opacity:0;transform:scale(.1) rotate(0)}25%{opacity:1}100%{opacity:0;transform:scale(2.3) rotate(210deg)}}
.sigil2.cast{animation-name:cast2}
@keyframes cast2{0%{opacity:0;transform:scale(.05) rotate(0)}30%{opacity:.9}100%{opacity:0;transform:scale(1.7) rotate(-260deg)}}
.flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#fff 0%,#FFE9A8 35%,transparent 70%);opacity:0}
.flash.go{animation:flash 1.1s ease-out both}
@keyframes flash{0%{opacity:0}35%{opacity:.9}100%{opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:99}
.toast{position:fixed;left:50%;bottom:26px;translate:-50% 20px;z-index:120;background:#2A1A05;color:#F7DE9B;padding:10px 20px;border-radius:999px;font-size:13.5px;opacity:0;transition:.35s var(--ease);pointer-events:none}
.toast.on{opacity:1;translate:-50% 0}
@media (max-width:520px){.hero{padding:26px 20px 20px}h1{font-size:22px}.wall{columns:1}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}}
</style>
</head>

    <button class="back" id="back" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>กลับ</button>
    <button class="btn gold" id="start2" type="button">เริ่มทำนาย</button>
  </header>
  <section class="rhead">
    <div class="brand">DataBest</div>
    <h2>เสียงจากผู้ที่เคยเปิดไพ่</h2>
    <div class="avg"><b id="avg">-</b><span class="st">★★★★★</span><small id="cnt"></small></div>
  </section>
  <section class="wall" id="wall"></section>
</main>

<div class="spiral" id="spiral" aria-hidden="true">
  <div class="sglow"></div><div id="sstage"></div>
  <div class="cap" id="cap">กำลังเปิดทางสู่ไพ่ของคุณ</div>
  <div class="whiteout" id="whiteout"></div>
  <a class="fallback" id="fb" target="_top" rel="noopener" href="https://line.me/R/ti/p/@972zzhhn">แตะเพื่อเปิด LINE</a>
</div>

<div class="spell" id="spell" aria-hidden="true">
  <div class="rv" id="rv"></div>
  <svg class="sigil" id="sg1" viewBox="0 0 400 400" fill="none" stroke="#F7DE9B" stroke-width="1.6" stroke-linecap="round">
    <circle cx="200" cy="200" r="190"/><circle cx="200" cy="200" r="176" stroke-dasharray="3 8"/><circle cx="200" cy="200" r="130"/>
    <polygon points="200,30 347,285 53,285"/><polygon points="200,370 347,115 53,115"/><circle cx="200" cy="200" r="60"/><g id="runes"></g>
  </svg>
  <svg class="sigil sigil2" id="sg2" viewBox="0 0 400 400" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round">
    <circle cx="200" cy="200" r="150" stroke-dasharray="1 9"/><circle cx="200" cy="200" r="104"/><polygon points="200,60 321,130 321,270 200,340 79,270 79,130"/>
  </svg>
  <div class="flash" id="flash"></div>
</div>

<canvas id="fx"></canvas>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var NS='http://www.w3.org/2000/svg';
var RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
var SHEET_ID='1yiWmkHGzUraIluNlHb5l9XS33M_JaSkYKKIRz8uVTSg';
var LINE_URL='https://line.me/R/ti/p/@972zzhhn';
var reviews=[],busy=false,view=1;

/* ชื่อแสดงแค่ 4 ตัวอักษรแรก + ***** */
function mask(n){return Array.from(String(n||'').trim()).slice(0,4).join('')+'*****'}
function esc(t){return String(t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function stars(n){return '★'.repeat(n)+'☆'.repeat(5-n)}
var toastT;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2200)}

/* ---------- ดึงรีวิวจาก Google Sheets ---------- */
function loadReviews(){
  var url='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq?tqx=out:json&headers=1&tq='+encodeURIComponent('select B,C,D');
  return fetch(url).then(function(r){return r.text()}).then(function(t){
    var j=JSON.parse(t.substring(t.indexOf('{'),t.lastIndexOf('}')+1));
    return j.table.rows.map(function(row){
      var c=row.c||[],g=function(i){return c[i]&&c[i].v!=null?c[i].v:''};
      var star=parseInt(g(1),10);
      return {name:mask(g(0)),rating:Math.min(5,Math.max(1,star||5)),review:String(g(2)).trim(),raw:String(g(0)).trim()};
    }).filter(function(x){return x.review&&x.raw}).slice(-120).reverse();
  });
}

/* ---------- ฉากหลัง ---------- */
function el(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
(function(){
  var pg=$('#petals');for(var i=0;i<12;i++)el('ellipse',{cx:250,cy:132,rx:20,ry:56,transform:'rotate('+i*30+' 250 250)'},pg);
  var st=$('#stars');for(var j=0;j<60;j++){var d=document.createElement('i');d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';d.style.animationDelay=Math.random()*4+'s';st.appendChild(d)}
  var rn=$('#runes');for(var k=0;k<12;k++){var a=k*Math.PI/6;var x=200+Math.cos(a)*158,y=200+Math.sin(a)*158;el('path',{d:'M'+x+' '+(y-9)+'L'+(x+4)+' '+y+'L'+x+' '+(y+9)+'L'+(x-4)+' '+y+'Z',fill:'#F7DE9B'},rn);el('line',{x1:200+Math.cos(a)*134,y1:200+Math.sin(a)*134,x2:200+Math.cos(a)*146,y2:200+Math.sin(a)*146},rn)}
})();

/* ---------- รีวิวลอยเป็นพื้นหลัง (หลายอันพร้อมกัน) ---------- */
var drift=$('#drift'),NOTES=0;
function mkNote(init){
  if(!reviews.length||view!==1)return;
  var r=reviews[Math.floor(Math.random()*reviews.length)],n=document.createElement('div'),depth=Math.random();
  n.className='note';
  n.innerHTML='<b>'+esc(r.name)+'</b><span class="st">'+stars(r.rating)+'</span><p>'+esc(r.review)+'</p>';
  var d=34-depth*16;
  n.style.setProperty('--x',(Math.random()*(innerWidth<600?60:82)).toFixed(1)+'vw');
  n.style.setProperty('--s',(.72+depth*.5).toFixed(2));
  n.style.setProperty('--op',(.28+depth*.6).toFixed(2));
  n.style.setProperty('--bl',((1-depth)*2.2).toFixed(1)+'px');
  n.style.setProperty('--sw',((Math.random()-.5)*60).toFixed(0)+'px');
  n.style.setProperty('--d',d.toFixed(1)+'s');
  n.style.setProperty('--dl',(init?-Math.random()*d:0)+'s');
  n.addEventListener('animationend',function(){n.remove();mkNote(false)});
  drift.appendChild(n);
}
function fillDrift(){drift.innerHTML='';var c=innerWidth<600?10:18;for(var i=0;i<c;i++)mkNote(true)}

/* ---------- หน้าอ่านรีวิว ---------- */
function renderWall(){
  var w=$('#wall');
  if(!reviews.length){w.innerHTML='<div class="empty">ยังโหลดรีวิวไม่ได้ในตอนนี้<br>ลองรีเฟรชหน้านี้อีกครั้งนะคะ</div>';$('#avg').textContent='-';$('#cnt').textContent='';return}
  var sum=0;reviews.forEach(function(r){sum+=r.rating});
  $('#avg').textContent=(sum/reviews.length).toFixed(1);$('#cnt').textContent='จาก '+reviews.length+' รีวิว';
  w.innerHTML=reviews.map(function(r,i){return '<article class="rc" style="animation-delay:'+Math.min(i,24)*55+'ms"><div class="hd"><b>'+esc(r.name)+'</b><span class="st">'+stars(r.rating)+'</span></div><p>'+esc(r.review)+'</p></article>'}).join('');
}

/* ---------- ประกายเวทย์ ---------- */
var cv=$('#fx'),cx=cv.getContext('2d'),ps=[];
function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener('resize',fit);fit();
function sparks(x,y,n,ring,cols){
  if(RM)return;
  for(var i=0;i<n;i++){var a=ring?i/n*6.283:Math.random()*6.283,v=ring?9:2+Math.random()*11;ps.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:2+Math.random()*4,l:1,c:cols[i%cols.length],rot:Math.random()*3})}
}
(function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  for(var i=ps.length-1;i>=0;i--){
    var p=ps[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy=p.vy*.96+.05;p.l-=.015;p.rot+=.1;
    if(p.l<=0){ps.splice(i,1);continue}
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.globalAlpha=p.l;cx.fillStyle=p.c;
    cx.beginPath();for(var k=0;k<4;k++){var a=k*Math.PI/2;cx.lineTo(Math.cos(a)*p.s*2,Math.sin(a)*p.s*2);cx.lineTo(Math.cos(a+Math.PI/4)*p.s*.5,Math.sin(a+Math.PI/4)*p.s*.5)}
    cx.closePath();cx.fill();cx.restore();
  }
  requestAnimationFrame(loop);
})();

/* ---------- เสกเวทย์สลับหน้า (1<>2) ---------- */
function swap(to){
  view=to;document.body.dataset.theme=to===2?'gold':'night';
  $('#v1').classList.toggle('on',to===1);$('#v2').classList.toggle('on',to===2);
  if(to===2){$('#v2').scrollTop=0;renderWall();drift.style.opacity=0}
  else{drift.style.opacity=1;fillDrift()}
}
function spell(to){
  if(busy||view===to)return;busy=true;
  if(RM){swap(to);busy=false;return}
  var sp=$('#spell'),rv=$('#rv'),s1=$('#sg1'),s2=$('#sg2'),fl=$('#flash');
  var cols=to===2?['#FFF6D5','#FFD36B','#fff','#F29B2C']:['#F3EAD3','#D9B56C','#B9A4FF','#7FB4FF'];
  rv.className='rv '+(to===2?'rv-gold':'rv-night');rv.style.transition='none';rv.style.clipPath='circle(0% at 50% 50%)';
  sp.className='spell on';[s1,s2,fl].forEach(function(e){e.classList.remove('cast','go')});
  void rv.offsetWidth;
  rv.style.transition='clip-path 1.2s cubic-bezier(.55,0,.2,1)';rv.style.clipPath='circle(150% at 50% 50%)';
  s1.classList.add('cast');setTimeout(function(){s2.classList.add('cast')},150);
  setTimeout(function(){fl.classList.add('go')},450);
  var cxp=innerWidth/2,cyp=innerHeight/2;
  sparks(cxp,cyp,90,true,cols);setTimeout(function(){sparks(cxp,cyp,70,false,cols)},350);setTimeout(function(){sparks(cxp,cyp,120,true,cols)},700);
  setTimeout(function(){swap(to)},1050);
  setTimeout(function(){sp.classList.add('out')},1250);
  setTimeout(function(){sp.className='spell';busy=false},1900);
}

/* ---------- สำรับไพ่หมุนเป็นเกลียว แล้วเด้งไป LINE ---------- */
var CARD='<svg viewBox="0 0 96 150"><rect x="1.5" y="1.5" width="93" height="147" rx="9" fill="#1B2358" stroke="#D9B56C" stroke-width="2"/><rect x="8" y="8" width="80" height="134" rx="5" fill="none" stroke="#D9B56C" stroke-opacity=".5"/><circle cx="48" cy="75" r="22" fill="none" stroke="#D9B56C"/><path d="M48 47l5 22 22 6-22 6-5 22-5-22-22-6 22-6z" fill="#D9B56C"/></svg>';
function openLine(){try{(window.top||window).location.href=LINE_URL}catch(e){window.open(LINE_URL,'_top')}}
function startSpiral(){
  if(busy)return;busy=true;
  var sp=$('#spiral'),st=$('#sstage'),fb=$('#fb'),wo=$('#whiteout');
  fb.classList.remove('on');wo.style.opacity=0;st.innerHTML='';sp.classList.add('on');
  if(RM){setTimeout(openLine,300);setTimeout(function(){fb.classList.add('on')},1200);return}
  var N=26,cards=[];
  for(var i=0;i<N;i++){var c=document.createElement('div');c.className='sc';c.innerHTML=CARD;c.style.zIndex=N-i;st.appendChild(c);cards.push(c)}
  var T=3000,t0=performance.now(),k=Math.min(1,Math.min(innerWidth,innerHeight)/560),done=false;
  (function f(now){
    var e=Math.min(1,(now-t0)/T),n=Math.min(N,1+Math.floor(e*e*N*1.25));
    var fin=e>.8?(e-.8)/.2:0,rot=e*3+e*e*14+fin*fin*10,rs=(1-fin*fin*.95)*k;
    for(var i=0;i<N;i++){
      var c=cards[i];
      if(i<n){
        c.classList.add('on');
        var ang=rot+i*.52,rad=(14+i*9.5)*rs,sc=(.5+(1-i/N)*.2)*(1-fin*.5);
        c.style.transform='translate('+(Math.cos(ang)*rad).toFixed(1)+'px,'+(Math.sin(ang)*rad).toFixed(1)+'px) rotate('+(ang*57.2958+90).toFixed(1)+'deg) scale('+sc.toFixed(3)+')';
      }
    }
    if(fin>.6)wo.style.opacity=Math.min(1,(fin-.6)/.4);
    if(e<1){requestAnimationFrame(f)}
    else if(!done){done=true;openLine();setTimeout(function(){fb.classList.add('on')},1400)}
  })(t0);
}
addEventListener('pageshow',function(ev){
  if(ev.persisted){$('#spiral').classList.remove('on');$('#whiteout').style.opacity=0;busy=false}
});

/* ---------- ปุ่มต่าง ๆ ---------- */
$('#start').addEventListener('click',startSpiral);
$('#start2').addEventListener('click',startSpiral);
$('#read').addEventListener('click',function(){spell(2)});
$('#back').addEventListener('click',function(){spell(1)});
$('#copy').addEventListener('click',function(){
  var t='@972zzhhn';
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(function(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()}).then(function(){toast('คัดลอก LINE ID แล้ว')});
});

/* ---------- เริ่มทำงาน ---------- */
fillDrift();
loadReviews().then(function(d){
  reviews=d;
  if(d.length){$('#stat').textContent='รีวิวจริงจากผู้ใช้ '+d.length+' รายการ';fillDrift()}
}).catch(function(){});
})();
</script>
</body>
</html>
